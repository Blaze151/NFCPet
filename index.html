<html lang="es">

<link rel="icon" type="image/svg+xml" href="logo/tagmex-vital-isotipo-negro-rojo.svg">
<link rel="stylesheet" href="style.css">

<script>
(function(){
  try{
    if(localStorage.getItem('tagmex-theme') === 'light'){
      document.documentElement.setAttribute('data-theme','light');
    }
  }catch(e){}
})();
</script>
</head>

<body>

<button

  class="theme-toggle"

  aria-label="Cambiar tema"
>☀️</button>

<div class="page">

 <div class="brand-footer">
  <img src="logo/tagmex-vital-logotipo-negro-rojo.svg" alt="Tagmex Vital" class="brand-footer-logo">
</div>

</div>

<script>

// =====================================================
// BASE DE DATOS
// =====================================================

const PERFILES = {

    nombre: "Abi",
    detalle: "Gata · Equipo de robótica Bcats",
    foto: "",
    critico: "",
    tipoSangre: "N/A",
    alergias: "N/A",
    condicionMedica: "N/A",

    telefonos: [
      {

      },
      {

      }
    ],

      "https://maps.google.com/?q=Instituto+Tecnológico+de+la+Laguna,+Torreón,+Coahuila"
  },


  humberto: {

    nombre: "Humberto",
    detalle: "20 años · Capitán del equipo de robótica Bcats",
    foto: "",
    critico: "",
    tipoSangre: "B+",
    alergias: "A los pendejos",
    condicionMedica: "N/A",

    correo: "",

    ocupacion: "Estudiante de Ingeniería Electrónica",

    telefonos: [
      {
        etiqueta: "Ing. Sergio Guardado",
        numero: "8711044146"
      }
    ],

    direccion: "Edificio 34F, Instituto Tecnológico de la Laguna",

    mapsUrl:
      "https://maps.google.com/?q=Instituto+Tecnológico+de+la+Laguna,+Torreón,+Coahuila"
  },

    fotoSecreta: "1.img/sergio-spiderman.jpg",

    condicionMedica: "N/A",

    ],

    identidad: "🕷️ Spider-Man",

    telefonos: [
      {
        etiqueta: "Sergio Alejandro",
        numero: "8711044146"
      },
      {
        etiqueta: "Adriana Puentes (Emergencia)",

      }
    ],

    telefonoEmergencia: "8713962060",

    direccion:
      "Instituto Tecnológico de la Laguna, Torreón, Coahuila",

    mapsUrl:
      "https://maps.google.com/?q=Instituto+Tecnológico+de+la+Laguna,+Torreón,+Coahuila"
  }

};


// =====================================================
// VARIABLES
// =====================================================

let holdTimer = null;

const HOLD_DURATION = 5000;


// =====================================================
// FUNCIONES AUXILIARES
// =====================================================

function hasValue(value){

  if(value === undefined || value === null){
    return false;
  }

  const text = String(value).trim().toLowerCase();

  return (
    text !== '' &&
    text !== 'n/a' &&
    text !== 'no especificadas' &&
    text !== 'no especificado'
  );
}


// =====================================================
// ICONOS
// =====================================================

function icon(type){

  const icons = {
    medical: '♥',
    allergy: '⚠',
    contact: '♧',
    personal: '●',
    mail: '✉',
    calendar: '▣',
    location: '⌖',
    work: '▤',
    studies: '▥',
    hobby: '★'
  };

  return icons[type] || '•';
}


// =====================================================
// RENDER
// =====================================================

function render(){

  const id = location.hash.slice(1).toLowerCase();

  const p = PERFILES[id];

  const card = document.getElementById('card');


  // ---------------------------------------------
  // Perfil inexistente
  // ---------------------------------------------

  if(!p){

    card.innerHTML = `
      <div class="body">

        <div class="section-card">

          <div class="empty">

            <p>
              Esta ficha no está activa todavía.
            </p>

            <p>
              Verifica el enlace, por ejemplo:<br>

              <code>
                ${location.origin}${location.pathname}#abi
              </code>

            </p>

          </div>

        </div>

      </div>
    `;

    return;
  }


  // ---------------------------------------------
  // FOTO
  // ---------------------------------------------

 const fotoHtml = p.foto
  ? `<img src="${p.foto}" alt="${p.nombre}" loading="lazy" draggable="false" oncontextmenu="return false;">`

    : `
      <div class="ph-fallback">
        ${p.tipo === 'mascota'
          ? '🐾'
          : (p.tipo === 'niño' ? '🧒' : '🧑')
        }
      </div>
    `;


  // ---------------------------------------------
  // ALERTAS
  // ---------------------------------------------

  const allergyTag = hasValue(p.alergias)

    ? `
      <div class="alert-tag">

        <span class="tag-icon">⚠</span>

        <span>
          <strong>Alergia:</strong>
          ${p.alergias}
        </span>

      </div>
    `

    : '';


  const conditionTag = hasValue(p.condicionMedica)

    ? `
      <div class="alert-tag">

        <span class="tag-icon">♥</span>

        <span>
          <strong>Condición:</strong>
          ${p.condicionMedica}
        </span>

      </div>
    `

    : '';


  const medicalTags =
    allergyTag || conditionTag

      ? `
        <div class="alert-tags">
          ${allergyTag}
          ${conditionTag}
        </div>
      `

      : '';


  // ---------------------------------------------
  // TELEFONOS
  // ---------------------------------------------

  const telefonosHtml = (p.telefonos || [])

    .map(t => `

      <div class="contact-row">

        <div class="contact-main">

          <div class="contact-name">
            ${t.etiqueta}
          </div>

          <span class="contact-phone">
            ${t.numero}
          </span>

        </div>

        <a
          class="call-circle"
          href="tel:${t.numero}"
          aria-label="Llamar a ${t.etiqueta}"
        >
          ☎
        </a>

      </div>

    `)

    .join('');


  // ---------------------------------------------
  // DIRECCIÓN
  // ---------------------------------------------

  const direccionHtml = p.mapsUrl

    ? `
      <a
        class="v"
        href="${p.mapsUrl}"
        target="_blank"
        rel="noopener"
      >
        ${p.direccion}
      </a>
    `

    : `
      <span class="v">
        ${p.direccion}
      </span>
    `;


  // =====================================================
  // HTML PRINCIPAL
  // =====================================================

  card.innerHTML = `

    <!-- CABECERA -->

    <div class="topbar">

      <div class="topbar-brand">

        <img
          src="logo/tagmex-vital-isotipo-blanco-rojo.svg"
          alt="Tagmex Vital"
          class="topbar-logo"
        >

        <span class="topbar-title">
          Ficha de emergencia
        </span>

      </div>

      <div class="nfc-badge">

        <span class="nfc-icon">
          ◉
        </span>

        NFC

      </div>

    </div>


    <!-- HERO -->

    <section class="hero">

      <div class="hero-photo-wrap">

        <div class="photo-wrap">

          ${fotoHtml}

        </div>

        <div class="medical-plus">
          +
        </div>

      </div>


      <h1>
        ${p.nombre}
      </h1>


      <p class="sub">
        ${p.detalle}
      </p>


      <div class="medical-summary">

        <div class="blood-card">

          <span class="blood-value">
            ${p.tipoSangre || 'N/A'}
          </span>

          <span class="blood-label">
            Tipo de sangre
          </span>

        </div>

        ${medicalTags}

      </div>

    </section>


    <!-- CONTENIDO -->

    <div class="body">


      <!-- IMPORTANTE -->

      ${p.critico ? `

        <div class="section-card">

          <div class="section-heading">

            <span class="heading-icon">
              ⚠
            </span>

            Importante

          </div>

          <div class="field">

            <span
              class="v"
              style="text-align:left;width:100%;"
            >
              ${p.critico}
            </span>

          </div>

        </div>

      ` : ''}


      <!-- INFORMACIÓN MÉDICA -->

      <div class="section-card">

        <div class="section-heading">

          <span class="heading-icon">
            ♥
          </span>

          Información médica

        </div>


        ${hasValue(p.alergias) ? `

          <div class="field">

            <span class="k">

              <span class="field-icon">
                ⚠
              </span>

              Alergias

            </span>

            <span class="v">
              ${p.alergias}
            </span>

          </div>

        ` : ''}


        ${hasValue(p.condicionMedica) ? `

          <div class="field">

            <span class="k">

              <span class="field-icon">
                ♥
              </span>

              Condiciones médicas

            </span>

            <span class="v">
              ${p.condicionMedica}
            </span>

          </div>

        ` : ''}


        <div class="field">

          <span class="k">

            <span class="field-icon">
              ●
            </span>

            Tipo de sangre

          </span>

          <span class="v">
            ${p.tipoSangre || 'N/A'}
          </span>

        </div>

      </div>


      <!-- CONTACTO DE EMERGENCIA -->

      <div class="section-card">

        <div class="section-heading">

          <span class="heading-icon">
            ♧
          </span>

          Contacto de emergencia

        </div>


        ${
          telefonosHtml ||

          `
            <div class="field">

              <span
                class="v"
                style="text-align:left;width:100%;"
              >
                Sin contactos registrados.
              </span>

            </div>
          `
        }

      </div>


      <!-- INFORMACIÓN PERSONAL -->

      <div
        class="section-card"
        id="informacion-personal"
      >

        <div class="section-heading">

          <span class="heading-icon">
            ●
          </span>

          Información personal

        </div>


        ${p.correo ? `

          <div class="field">

            <span class="k">

              <span class="field-icon">
                ✉
              </span>

              Correo

            </span>

            <a
              class="v"
              href="mailto:${p.correo}"
            >
              ${p.correo}
            </a>

          </div>

        ` : ''}


        ${p.fechaNacimiento ? `

          <div class="field">

            <span class="k">

              <span class="field-icon">
                ▣
              </span>

              Fecha de nacimiento

            </span>

            <span class="v">
              ${p.fechaNacimiento}
            </span>

          </div>

        ` : ''}


        ${p.ocupacion ? `

          <div class="field long">

            <span class="k">

              <span class="field-icon">
                ▤
              </span>

              Ocupación

            </span>

            <span class="v">
              ${p.ocupacion}
            </span>

          </div>

        ` : ''}


        ${p.estudios ? `

          <div class="field long">

            <span class="k">

              <span class="field-icon">
                ▥
              </span>

              Estudios

            </span>

            <span class="v">
              ${p.estudios.join('<br>')}
            </span>

          </div>

        ` : ''}


        ${p.hobbies ? `

          <div class="field">

            <span class="k">

              <span class="field-icon">
                ★
              </span>

              Hobbies

            </span>

            <span class="v">
              ${p.hobbies}
            </span>

          </div>

        ` : ''}


        <div class="field long">

          <span class="k">

            <span class="field-icon">
              ⌖
            </span>

            Dirección

          </span>

          ${direccionHtml}

        </div>


        <!-- ==========================================
             IDENTIDAD SECRETA
             IMPORTANTE:
             Empieza completamente oculta.
             ========================================== -->

        ${p.identidad ? `

          <div
            class="field oculto"
            id="campo-identidad"
          >

            <span class="k">

              <span class="field-icon">
                ★
              </span>

              Identidad secreta

            </span>

            <span class="v">
              ${p.identidad}
            </span>

          </div>

        ` : ''}

      </div>


      <!-- BOTONES -->

      <div class="actions">

        <a
          class="btn primary"
          href="tel:${
            p.telefonos && p.telefonos[0]
              ? p.telefonos[0].numero
              : ''
          }"
        >

          <span class="btn-icon">
            ☎
          </span>

          <span>
            Llamar
          </span>

        </a>


        ${
          p.mapsUrl

            ? `

              <a
                class="btn secondary"
                href="${p.mapsUrl}"
                target="_blank"
                rel="noopener"
              >

                <span class="btn-icon">
                  ⌖
                </span>

                <span>
                  Ver mapa
                </span>

              </a>

            `

            : ''
        }


        <button
          class="btn"
          type="button"
          onclick="
            document
              .getElementById('informacion-personal')
              .scrollIntoView({
                behavior:'smooth',
                block:'start'
              })
          "
        >

          <span class="btn-icon">
            ✚
          </span>

          <span>
            Más información
          </span>

        </button>

      </div>


      <!-- BOTÓN DE EMERGENCIA -->

      <button
        class="emergency-button"
        type="button"
        onclick="emergencyCall()"
      >

        <span class="em-icon">
          ⚠
        </span>

        <span>

          <strong>
            En caso de emergencia
          </strong>

          <span>
            Presiona para llamar al contacto de emergencia
          </span>

        </span>

        <span class="arrow">
          ›
        </span>

      </button>


      <p class="foot">
        Escaneado vía etiqueta NFC · información de emergencia
      </p>

    </div>

  `;


  // Activar función secreta solamente si corresponde
  attachHoldReveal(p);

}


// =====================================================
// LLAMADA DE EMERGENCIA
// =====================================================

function emergencyCall(){

  const id = location.hash.slice(1).toLowerCase();

  const p = PERFILES[id];

  if(!p) return;


  const numero =
    p.telefonoEmergencia ||
    (
      p.telefonos &&
      p.telefonos[0]
        ? p.telefonos[0].numero
        : ''
    );


  if(numero){

    window.location.href =
      'tel:' + numero;

  }

}


// =====================================================
// FUNCIÓN SECRETA
// MANTENER FOTO 5 SEGUNDOS
// =====================================================

function attachHoldReveal(p){
  const wrap = document.querySelector('.photo-wrap');
  if(!wrap) return;

  const img = wrap.querySelector('img');
  if(!img) return;

  let holdTimer = null;
  let startTime = 0;
  let longPressActivated = false;

  const HOLD_DURATION = 5000;

  function iniciar(e){
    startTime = Date.now();
    longPressActivated = false;

    wrap.classList.add('holding');

    clearTimeout(holdTimer);

    holdTimer = setTimeout(() => {
      longPressActivated = true;
      triggerSpideyReveal(p, wrap);
    }, HOLD_DURATION);
  }

  function terminar(e){
    clearTimeout(holdTimer);
    wrap.classList.remove('holding');

    const tiempoPresionado = Date.now() - startTime;

    // Si fue un toque corto, abrir la foto
    if(!longPressActivated && tiempoPresionado < HOLD_DURATION){
      abrirFoto(img.src);
    }
  }

  function cancelar(){
    clearTimeout(holdTimer);
    wrap.classList.remove('holding');
  }

  // PC
  wrap.addEventListener('mousedown', iniciar);
  wrap.addEventListener('mouseup', terminar);
  wrap.addEventListener('mouseleave', cancelar);

  // CELULAR / TABLET
  wrap.addEventListener('touchstart', iniciar, {passive:true});
  wrap.addEventListener('touchend', terminar, {passive:true});
  wrap.addEventListener('touchcancel', cancelar, {passive:true});

  // Evitar menú contextual
  wrap.addEventListener('contextmenu', e => {
    e.preventDefault();
  });
}

// =====================================================
// REVELAR SPIDER-MAN
// =====================================================

function triggerSpideyReveal(p, wrap){

  wrap.classList.remove('holding');


  const overlay =
    document.createElement('div');


  overlay.className =
    'spidey-overlay';


  overlay.innerHTML = `
    <span class="spidey-emoji">
      🕷️
    </span>
  `;


  document.body.appendChild(overlay);


  setTimeout(() => {

    // Cambiar fotografía
    const img =
      wrap.querySelector('img');


    if(img){

      img.src =
        p.fotoSecreta;

      // La nueva foto también puede abrirse
      img.onclick = () => {
        abrirFoto(img.src);
      };

    }


    // ---------------------------------------------
    // AHORA SÍ mostrar identidad secreta
    // ---------------------------------------------

    const campo =
      document.getElementById('campo-identidad');


    if(campo){

      campo.classList.add('mostrar');

    }


    overlay.remove();

  }, 1400);

}


// =====================================================
// VISOR DE FOTO
// =====================================================

function abrirFoto(src){

  if(document.querySelector('.visor-foto')){
    return;
  }


  const visor =
    document.createElement('div');


  visor.className =
    'visor-foto';


  visor.setAttribute(
    'role',
    'dialog'
  );


  visor.setAttribute(
    'aria-modal',
    'true'
  );


  visor.innerHTML = `

    <button
      class="cerrar"
      type="button"
      aria-label="Cerrar foto"
    >
      &times;
    </button>

    <img
      src="${src}"
      alt="Foto ampliada"
      draggable="false"
    >

  `;


  const cerrarVisor = () => {

    document.removeEventListener(
      'keydown',
      manejarTecla
    );

    visor.remove();

  };


  const manejarTecla = (e) => {

    if(e.key === 'Escape'){

      cerrarVisor();

    }

  };


  visor.addEventListener(
    'click',
    (e) => {

      if(
        e.target === visor ||
        e.target.classList.contains('cerrar')
      ){

        cerrarVisor();

      }

    }
  );


  document.addEventListener(
    'keydown',
    manejarTecla
  );


  document.body.appendChild(visor);

}


// =====================================================
// HASH
// =====================================================

window.addEventListener(
  'hashchange',
  render
);


render();


// =====================================================
// TEMA
// =====================================================

function updateToggleIcon(){
  const btn = document.getElementById('theme-toggle');
  const isLight = document.documentElement.getAttribute('data-theme') === 'light';
  if(btn) btn.textContent = isLight ? '🌙' : '☀️';
}
}


document
  .getElementById('theme-toggle')
  .addEventListener(
    'click',
    function(){

      const root =
        document.documentElement;


      const isLight =
        root.getAttribute('data-theme') === 'light';


      if(isLight){

        root.removeAttribute(
          'data-theme'
        );

        localStorage.setItem(
          'tagmex-theme',
          'dark'
        );

      }else{

        root.setAttribute(
          'data-theme',
          'light'
        );

        localStorage.setItem(
          'tagmex-theme',
          'light'
        );

      }


      updateToggleIcon();

    }
  );


updateToggleIcon();


// =====================================================
// SPLASH
// =====================================================

window.addEventListener(
  'load',
  function(){

    setTimeout(
      function(){

        const splash =
          document.getElementById('splash');


        if(splash){

          splash.classList.add(
            'splash-hide'
          );


          setTimeout(
            function(){

              splash.remove();

            },
            600
          );

        }

      },
      1800
    );

  }
);

</script>

</body>
</html>

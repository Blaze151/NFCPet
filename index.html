<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Ficha de emergencia</title>
<link rel="icon" type="image/svg+xml" href="logo/tagmex-vital-isotipo-negro-rojo.svg">
<link rel="stylesheet" href="style.css">
<script>
/* Aplica el tema guardado ANTES de pintar la página, para evitar parpadeo de claro→oscuro */
(function(){
  try{
    if(localStorage.getItem('tagmex-theme') === 'dark'){
      document.documentElement.setAttribute('data-theme','dark');
    }
  }catch(e){}
})();
</script>
<style>
/* ── Estilos para la función especial de Sergio (mantén aquí o muévelos a style.css) ── */
.photo-wrap { position: relative; }
.photo-wrap img {
  -webkit-touch-callout: none; /* evita el menú de "Guardar imagen/Buscar con Google Lens" en iOS */
  -webkit-user-select: none;
  user-select: none;
}

.photo-wrap.holding::after {
  content: "";
  position: absolute; inset: -6px;
  border-radius: 50%;
  border: 4px solid rgba(196,0,0,.15);
  border-top-color: #c40000;
  animation: holdSpin 5s linear forwards;
  pointer-events: none;
}
@keyframes holdSpin {
  to { transform: rotate(360deg); border-top-color: #0033a0; }
}

.spidey-overlay {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: radial-gradient(circle, rgba(196,0,0,.9), rgba(0,51,160,.9));
  animation: spideyPulse 1.4s ease forwards;
  overflow: hidden;
  z-index: 9999;
}
.spidey-overlay::before {
  content: "";
  position: absolute; inset: 0;
  background: repeating-conic-gradient(from 0deg, rgba(255,255,255,.35) 0deg 2deg, transparent 2deg 20deg);
  animation: spideyWeb 1.2s ease-out forwards;
}
.spidey-emoji {
  font-size: 6rem;
  z-index: 1;
  animation: spideyPop 1.4s ease forwards;
}
@keyframes spideyPulse {
  0%   { opacity: 0; transform: scale(.6); }
  20%  { opacity: 1; transform: scale(1.1); }
  60%  { transform: scale(1); }
  100% { opacity: 0; transform: scale(1.3); }
}
@keyframes spideyWeb {
  0%   { transform: scale(0) rotate(0deg); opacity: .9; }
  100% { transform: scale(2) rotate(180deg); opacity: 0; }
}
@keyframes spideyPop {
  0%, 60% { transform: scale(0) rotate(-20deg); opacity: 0; }
  75%     { transform: scale(1.4) rotate(10deg); opacity: 1; }
  100%    { transform: scale(1) rotate(0deg); opacity: 1; }
}

.field.oculto { display: none; }
.field.oculto.mostrar {
  display: flex;
  animation: fadeInField .6s ease;
}
@keyframes fadeInField {
  from { opacity: 0; transform: translateY(-4px); }
  to   { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<!-- Splash de bienvenida: se muestra 5s al cargar, luego se retira solo -->
<div id="splash" class="splash">
  <img src="logo/tagmex-vital-imagotipo-blanco-rojo.svg" alt="Tagmex Vital" class="splash-logo">
</div>

<!-- Botón de modo oscuro: flotante, visible en cualquier ficha -->
<button id="theme-toggle" class="theme-toggle" type="button" aria-label="Cambiar a modo oscuro">🌙</button>

<div class="page">
  <div class="card" id="card"></div>
  <div class="brand-footer">
    <img src="logo/tagmex-vital-logotipo-negro-rojo.svg" alt="Tagmex Vital" class="brand-footer-logo">
  </div>
</div>

<script>
// ── Base de datos: edita/agrega perfiles aquí ──
const PERFILES = {

  abi: {
    tipo: "mascota",
    nombre: "Abi",
    detalle: "Gata · Equipo de robótica Bcats",
    foto: "",
    critico: "",
    tipoSangre: "N/A",
    alergias: "N/A",
    telefonos: [
      { etiqueta: "Humberto Morales Carrillo", numero: "8713588027" },
      { etiqueta: "Daniel Hernández Bajini", numero: "8716044220" }
    ],
    direccion: "Aula 34G, Instituto Tecnológico de la Laguna",
    mapsUrl: "https://maps.google.com/?q=Instituto+Tecnológico+de+la+Laguna,+Torreón,+Coahuila"
  },

  humberto: {
    tipo: "persona",
    nombre: "Humberto",
    detalle: "20 años · Capitán del equipo de robótica Bcats",
    foto: "",
    critico: "",
    tipoSangre: "B+",
    alergias: "A los pendejos",
    telefonos: [
      { etiqueta: "Ing. Sergio Guardado", numero: "8711044146" }
    ],
    direccion: "Edificio 34F, Instituto Tecnológico de la Laguna",
    mapsUrl: "https://maps.google.com/?q=Instituto+Tecnológico+de+la+Laguna,+Torreón,+Coahuila"
  },

  sergio: {
    tipo: "persona",
    nombre: "Sergio Alejandro Guardado Martínez",
    detalle: "38 años · Docente Titular C · Coordinador de Ingeniería Electrónica y Semiconductores",
    foto: "1.img/sergio.jpg",
    // ── Función especial: mantener presionada la foto 10s ──
    holdReveal: true,
    fotoSecreta: "1.img/sergio-spiderman.jpg",
    critico: "",
    tipoSangre: "A+",
    alergias: "No especificadas",
    correo: "sergioteclaguna@gmail.com",
    ocupacion: "Docente de tiempo completo Titular C en el Instituto Tecnológico de la Laguna (Tecnológico Nacional de México). Coordinador de Ingeniería Electrónica e Ingeniería en Semiconductores.",
    estudios: [
      "Ingeniero en Electrónica",
      "Maestría en Educación",
      "Maestría en Ciencias en Ingeniería Eléctrica"
    ],
    hobbies: "🏍️ Motociclista",
    identidad: "🕷️ Spider-Man",
    telefonos: [
      { etiqueta: "Sergio Alejandro", numero: "8711044146" },
      { etiqueta: "Adriana Puentes (Emergencia)", numero: "8713962060" }
    ],
    direccion: "Instituto Tecnológico de la Laguna, Torreón, Coahuila",
    mapsUrl: "https://maps.google.com/?q=Instituto+Tecnológico+de+la+Laguna,+Torreón,+Coahuila"
  }

};

let holdTimer = null;
const HOLD_DURATION = 5000; // 5 segundos

function render(){

  const id = location.hash.slice(1).toLowerCase();
  const p = PERFILES[id];
  const card = document.getElementById('card');

  if(!p){
    card.innerHTML = `
      <div class="empty">
        <p>Esta ficha no está activa todavía.</p>
        <p>Verifica el enlace, por ejemplo:<br>
        <code>${location.origin}${location.pathname}#abi</code></p>
      </div>`;
    return;
  }

  const fotoHtml = p.foto
  ? `<img src="${p.foto}" alt="${p.nombre}" onclick="abrirFoto(this.src)" loading="lazy" draggable="false" oncontextmenu="return false;">`
  : `<div class="ph-fallback">${p.tipo === 'mascota' ? '🐾' : (p.tipo === 'niño' ? '🧒' : '🧑')}</div>`;

  const telefonosHtml = p.telefonos.map(t => `
    <div class="field">
      <span class="k">${t.etiqueta}</span>
      <a class="v" href="tel:${t.numero}">${t.numero}</a>
    </div>`).join('');

  const direccionHtml = p.mapsUrl
    ? `<a class="v" href="${p.mapsUrl}" target="_blank" rel="noopener">${p.direccion}</a>`
    : `<span class="v">${p.direccion}</span>`;

  card.innerHTML = `
    <div class="band">
      <p class="eyebrow">${p.tipo === 'mascota' ? 'Ficha de mascota' : 'Ficha de emergencia'}</p>
      <h1>${p.nombre}</h1>
      <p class="sub">${p.detalle}</p>
      <div class="photo-wrap">${fotoHtml}</div>
    </div>

    <div class="body">

      ${p.critico ? `
      <div class="critical">
        <span class="dot"></span>
        <div><strong>Importante</strong><span>${p.critico}</span></div>
      </div>` : ''}

      <div class="field">
        <span class="k">Tipo de sangre</span>
        <span class="v">${p.tipoSangre}</span>
      </div>

      <div class="field">
        <span class="k">Alergias</span>
        <span class="v">${p.alergias}</span>
      </div>

      ${p.correo ? `
      <div class="field">
        <span class="k">Correo</span>
        <a class="v" href="mailto:${p.correo}">${p.correo}</a>
      </div>` : ''}

      ${p.ocupacion ? `
      <div class="field">
        <span class="k">Ocupación</span>
        <span class="v">${p.ocupacion}</span>
      </div>` : ''}

      ${p.estudios ? `
      <div class="field">
        <span class="k">Estudios</span>
        <span class="v">${p.estudios.join('<br>')}</span>
      </div>` : ''}

      ${p.hobbies ? `
      <div class="field">
        <span class="k">Hobbies</span>
        <span class="v">${p.hobbies}</span>
      </div>` : ''}

      ${p.identidad ? `
      <div class="field oculto" id="campo-identidad">
        <span class="k">Identidad secreta</span>
        <span class="v">${p.identidad}</span>
      </div>` : ''}

      <div class="field">
        <span class="k">Dirección</span>
        ${direccionHtml}
      </div>

      <p class="section-label">Contactos</p>

      ${telefonosHtml}

      <div class="actions">
        <a class="btn primary" href="tel:${p.telefonos[0].numero}">Llamar</a>
        ${p.mapsUrl ? `<a class="btn secondary" href="${p.mapsUrl}" target="_blank" rel="noopener">Ver mapa</a>` : ''}
      </div>

      <p class="foot">Escaneado vía etiqueta NFC · información de emergencia</p>

    </div>`;

  attachHoldReveal(p);
}

// ── Mantener presionada la foto 10s para revelar identidad secreta ──
function attachHoldReveal(p){
  if(!p.holdReveal || !p.fotoSecreta) return;

  const wrap = document.querySelector('.photo-wrap');
  if(!wrap) return;

  const start = () => {
    wrap.classList.add('holding');
    holdTimer = setTimeout(() => triggerSpideyReveal(p, wrap), HOLD_DURATION);
  };
  const cancel = () => {
    wrap.classList.remove('holding');
    clearTimeout(holdTimer);
  };

  wrap.addEventListener('mousedown', start);
  wrap.addEventListener('mouseup', cancel);
  wrap.addEventListener('mouseleave', cancel);
  wrap.addEventListener('touchstart', start, { passive: true });
  wrap.addEventListener('touchend', cancel);
  wrap.addEventListener('touchcancel', cancel);
  wrap.addEventListener('contextmenu', (e) => e.preventDefault());
}

function triggerSpideyReveal(p, wrap){
  wrap.classList.remove('holding');

  const overlay = document.createElement('div');
  overlay.className = 'spidey-overlay';
  overlay.innerHTML = '<span class="spidey-emoji">🕷️</span>';
  document.body.appendChild(overlay);

  setTimeout(() => {
    const img = wrap.querySelector('img');
    if(img) img.src = p.fotoSecreta;
    overlay.remove();

    const campo = document.getElementById('campo-identidad');
    if(campo) campo.classList.add('mostrar');
  }, 1400);
}

function abrirFoto(src){
  // Evita abrir dos visores
  if(document.querySelector(".visor-foto")) return;

  const visor = document.createElement("div");
  visor.className = "visor-foto";

  visor.innerHTML = `
      <span class="cerrar">&times;</span>
      <img src="${src}" alt="Foto">
  `;

  visor.onclick = function(e){
      if(e.target === visor || e.target.classList.contains("cerrar")){
          visor.remove();
      }
  };

  document.body.appendChild(visor);
}

window.addEventListener('hashchange', render);
render();

</script>

<script>
/* ── Splash de bienvenida y modo oscuro (nuevo, no modifica nada de lo anterior) ── */

function updateToggleIcon(){
  const btn = document.getElementById('theme-toggle');
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  if(btn) btn.textContent = isDark ? '☀️' : '🌙';
}

document.getElementById('theme-toggle').addEventListener('click', function(){
  const root = document.documentElement;
  const isDark = root.getAttribute('data-theme') === 'dark';
  if(isDark){
    root.removeAttribute('data-theme');
    localStorage.setItem('tagmex-theme', 'light');
  } else {
    root.setAttribute('data-theme', 'dark');
    localStorage.setItem('tagmex-theme', 'dark');
  }
  updateToggleIcon();
});

updateToggleIcon();

window.addEventListener('load', function(){
  setTimeout(function(){
    const splash = document.getElementById('splash');
    if(splash){
      splash.classList.add('splash-hide');
      setTimeout(function(){ splash.remove(); }, 600);
    }
  }, 5000);
});
</script>

</body>
</html>

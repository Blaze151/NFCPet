<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Ficha de emergencia</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card" id="card"></div>

<script>
// ── Base de datos: edita/agrega perfiles aquí ──
const PERFILES = {
  rex: {
    tipo: "mascota",
    nombre: "Rex",
    detalle: "Labrador · 4 años",
    foto: "",
    critico: "Toma medicamento para epilepsia dos veces al día.",
    tipoSangre: "N/A",
    alergias: "Ninguna conocida",
    telefonos: [
      { etiqueta: "Dueño (Humberto)", numero: "8711234567" },
      { etiqueta: "Veterinario", numero: "8717654321" }
    ],
    direccion: "Torreón, Coahuila",
    mapsUrl: "https://maps.google.com/?q=Torreón,Coahuila"
  },
  juanito: {
    tipo: "niño",
    nombre: "Juan Pérez",
    detalle: "8 años",
    foto: "",
    critico: "Alérgico a la penicilina. Asmático — inhalador en mochila.",
    tipoSangre: "O+",
    alergias: "Penicilina",
    telefonos: [
      { etiqueta: "Mamá (Ana)", numero: "8719876543" },
      { etiqueta: "Papá (Luis)", numero: "8711112222" }
    ],
    direccion: "Col. Centro, Torreón, Coahuila",
    mapsUrl: "https://maps.google.com/?q=Col.+Centro,Torreón,Coahuila"
  }
};

function render(){
  const id = location.hash.slice(1).toLowerCase();
  const p = PERFILES[id];
  const card = document.getElementById('card');

  if(!p){
    card.innerHTML = `
      <div class="empty">
        <p>Esta ficha no está activa todavía.</p>
        <p>Verifica el enlace, por ejemplo:<br><code>${location.origin}${location.pathname}#rex</code></p>
      </div>`;
    return;
  }

  const fotoHtml = p.foto
    ? `<img src="${p.foto}" alt="${p.nombre}">`
    : `<div class="ph-fallback">${p.tipo === 'mascota' ? '🐾' : '🧒'}</div>`;

  const telefonosHtml = p.telefonos.map(t => `
    <div class="field">
      <span class="k">${t.etiqueta}</span>
      <a class="v" href="tel:${t.numero}">${t.numero}</a>
    </div>`).join('');

  const direccionHtml = p.mapsUrl
    ? `<a class="v" href="${p.mapsUrl}" target="_blank" rel="noopener">${p.direccion}</a>`
    : `<span class="v">${p.direccion}</span>`;

  card.innerHTML = `
    <div class="band">
      <p class="eyebrow">${p.tipo === 'mascota' ? 'Ficha de mascota' : 'Ficha de emergencia'}</p>
      <h1>${p.nombre}</h1>
      <p class="sub">${p.detalle}</p>
      <div class="photo-wrap">${fotoHtml}</div>
    </div>
    <div class="body">
      ${p.critico ? `
      <div class="critical">
        <span class="dot"></span>
        <div><strong>Importante</strong><span>${p.critico}</span></div>
      </div>` : ''}

      <div class="field"><span class="k">Tipo de sangre</span><span class="v">${p.tipoSangre}</span></div>
      <div class="field"><span class="k">Alergias</span><span class="v">${p.alergias}</span></div>
      <div class="field"><span class="k">Dirección</span>${direccionHtml}</div>

      <p class="section-label">Contactos</p>
      ${telefonosHtml}

      <div class="actions">
        <a class="btn primary" href="tel:${p.telefonos[0].numero}">Llamar</a>
        ${p.mapsUrl ? `<a class="btn secondary" href="${p.mapsUrl}" target="_blank" rel="noopener">Ver mapa</a>` : ''}
      </div>
      <p class="foot">Escaneado vía etiqueta NFC · información de emergencia</p>
    </div>`;
}

window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
